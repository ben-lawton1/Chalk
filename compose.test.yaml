name: chalk-test
x-health: &health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 5s
  start_interval: 1s
services:
  app-test:                         # isolated instance, throwaway DB in /tmp; NEVER touches chalk-data
    image: chalk-app-test:${CHALK_TEST_TAG:-local}
    build:
      context: .
      target: runtime
    environment:
      CHALK_LIBRARY_DIR: /tmp/chalk-e2e-library
      CHALK_DB_PATH: ""
      CHALK_TERMINAL_URL: http://term-test:7681
    healthcheck: *health
  term-test:                        # the host bridge (Linux build) for the terminal e2e; private network only
    image: chalk-term-test:${CHALK_TEST_TAG:-local}
    build:
      context: ./bridge
      target: runtime
    command: ["--addr", "0.0.0.0:7681", "--allow-non-loopback", "--config", "/etc/chalk-terminal.json"]
    volumes:
      - ./bridge/testdata/e2e-terminal.json:/etc/chalk-terminal.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Origin: http://app-test:8000", "http://term-test:7681/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 2s
      start_interval: 1s
  e2e:
    image: chalk-e2e:${CHALK_TEST_TAG:-local}
    build:
      context: ./e2e
    depends_on:
      app-test:
        condition: service_healthy
      term-test:
        condition: service_healthy
    environment:
      BASE_URL: http://app-test:8000
      CI: "1"
    ipc: host
    init: true
    volumes:
      - ./e2e/tests:/e2e/tests:ro
      - ./e2e/artifacts:/e2e/artifacts
  web-unit:
    image: chalk-web-dev:${CHALK_TEST_TAG:-local}
    profiles: ["unit"]
    build:
      context: .
      target: web-dev
    volumes:
      - ./frontend/src:/web/src:ro
    command: ["npm", "run", "check"]
  api-unit:
    image: chalk-api-dev:${CHALK_TEST_TAG:-local}
    profiles: ["unit"]
    build:
      context: .
      target: api-dev
    environment:
      CHALK_LIBRARY_DIR: /tmp/chalk-unit-library
      CHALK_DB_PATH: ""
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
    command: ["pytest"]
